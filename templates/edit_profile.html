{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<h2>Edit Profile for {{ student.full_name }}</h2>

<form method="post" enctype="multipart/form-data">
    <div class="mb-3">
        <label for="attendance_status" class="form-label">Attendance Status</label>
        <select class="form-select" id="attendance_status" name="attendance_status">
            <option value="Coming" {% if student.status=='Coming' %}selected{% endif %}>Yes, I'm coming!</option>
            <option value="Not Coming" {% if student.status=='Not Coming' %}selected{% endif %}>Sorry, I can't make it.
            </option>
            <option value="No Response" {% if student.status=='No Response' %}selected{% endif %}>I'm not sure yet.
            </option>
            {% if current_user.is_admin %}
            <option value="Deceased" {% if student.status=='Deceased' %}selected{% endif %}>In Memoriam (Admin only)
            </option>
            {% endif %}
        </select>
    </div>

    <div class="mb-3">
        <label for="guests" class="form-label">Number of Guests (besides yourself)</label>
        <input type="number" class="form-control" id="guests" name="guests" value="{{ student.guests }}" min="0"
            max="5">
    </div>

    <div class="mb-3">
        <label for="biography" class="form-label">My Bio (The last 50 years...)</label>
        <textarea class="form-control" id="biography" name="biography" rows="6">{{ student.biography or '' }}</textarea>
    </div>

    <div class="mb-3">
        <label for="photo" class="form-label">Update Photo</label>
        <input class="form-control" type="file" id="photo" name="photo" accept="image/png, image/jpeg, image/gif">
        {% if student.photo_filename %}
        <div class="mt-2">
            <p>Current Photo:</p>
            <img src="{{ request.url_for('uploads', path=student.photo_filename) }}" alt="Current photo" style="max-width: 200px; border-radius: 5px;">
        </div>
        {% endif %}
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ request.url_for('students_page') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
