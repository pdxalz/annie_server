<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Status | Sauvie Island Wind</title>
  <meta name="robots" content="noindex, nofollow">
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f3a93'/%3E%3Cpath d='M12 24h30a6 6 0 1 0-6-6M12 36h38a6 6 0 1 1-6 6M12 48h20' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css?v=4">
</head>
<body>
  <header class="topbar">
    <h1>System Status</h1>
    <div class="topbar-actions">
      <a href="/" class="topbar-link">Live wind</a>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch light/dark theme" title="Switch light/dark theme">
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="toolbar">
        <h2>Annie Sensor Health</h2>
        <div class="seg" id="health-hours" role="group" aria-label="Health time range">
          <button type="button" data-hours="24" aria-pressed="true">24h</button>
          <button type="button" data-hours="168" aria-pressed="false">7d</button>
        </div>
      </div>
      <div id="sensor-stats" class="stat-grid">
        <p class="muted">Loading sensor health...</p>
      </div>
      <div class="chart-wrap chart-wrap-sm">
        <canvas id="health-chart" aria-label="Annie battery and temperature chart" role="img"></canvas>
      </div>
      <p id="health-empty" class="muted center small" hidden>No sensor health messages recorded in this window yet.</p>
    </section>

    <section class="card">
      <h2>Website Traffic (Page Hits)</h2>
      <div id="hits-stats" class="stat-grid">
        <p class="muted">Loading traffic...</p>
      </div>
      <div class="table-scroll">
        <table class="status-table" id="hits-table"></table>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>Server &amp; Storage</h2>
        <div id="server-stats">
          <p class="muted">Loading server stats...</p>
        </div>
      </section>

      <section class="card">
        <h2>Data Freshness &amp; Counts</h2>
        <div id="freshness-stats">
          <p class="muted">Loading freshness...</p>
        </div>
      </section>
    </div>
  </main>

  <script src="/static/vendor/chart.umd.js"></script>
  <script type="module" src="/static/js/status.js?v=5"></script>
</body>
</html>
