# Saved Nginx configuration for sauviewind.net
# Pre-Certbot baseline config to use on fresh Ubuntu install:
#
# server {
#     listen 80;
#     server_name sauviewind.net www.sauviewind.net 107.174.172.150;
#
#     location / {
#         proxy_pass http://127.0.0.1:8000;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }
#
# Then run: sudo certbot --nginx -d sauviewind.net -d www.sauviewind.net
# Certbot will automatically convert it into the SSL config below:

server {
    server_name sauviewind.net www.sauviewind.net 107.174.172.150;

    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.sauviewind.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.sauviewind.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.sauviewind.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = sauviewind.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    server_name sauviewind.net www.sauviewind.net 107.174.172.150;
    return 404; # managed by Certbot
}
